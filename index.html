<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Calçada · Português europeu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;0,800;1,400&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Gentium+Plus:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-head">
  <div class="site-head__in">
    <a class="brand" href="#">
      <span class="brand__tile" aria-hidden="true"></span>
      <span class="brand__name">Calçada</span>
      <span class="brand__tag">Português europeu, pedra a pedra</span>
    </a>
  </div>
</header>

<div class="layout">
  <aside class="side">
    <nav id="nav" aria-label="Niveaux et outils"></nav>
  </aside>
  <main class="main" id="main" tabindex="-1"></main>
</div>

<div class="tip" id="tip" role="tooltip" hidden></div>

<!-- ═══════════════════════════════════════════════
     BRIQUE 1 — CONFIG (niveaux, programme de grammaire)
═══════════════════════════════════════════════ -->
<script src="js/config.js"></script>

<!-- BRIQUE PRONONCIATION — lecture guidée (convertit l'API des données) -->
<script src="js/pron.js"></script>

<!-- ═══════════════════════════════════════════════
     BRIQUES DONNÉES — un fichier par niveau
     Chaque fichier définit A1_TEXTS, A2_TEXTS…
     Pour ajouter C1 : créer js/data/c1.js + l'entrée dans config.js
═══════════════════════════════════════════════ -->
<script src="js/data/a1.js"></script>
<script src="js/data/a2.js"></script>
<script src="js/data/b1.js"></script>
<script src="js/data/b2.js"></script>

<!-- ═══════════════════════════════════════════════
     BRIQUES VOCABULAIRE THÉMATIQUE — un fichier par niveau
     Chaque fichier définit A1_VOCAB_THEMATIC…
═══════════════════════════════════════════════ -->
<script src="js/vocab/a1_thematic.js"></script>
<script src="js/vocab/a2_thematic.js"></script>
<script src="js/vocab/b1_thematic.js"></script>
<script src="js/vocab/b2_thematic.js"></script>

<!-- ═══════════════════════════════════════════════
     BRIQUES AUDIO — générées par tools/make_audio.py (voix pt-PT native)
     Chaque fichier définit A1_AUDIO… ; une brique absente = repli sur la voix du navigateur
═══════════════════════════════════════════════ -->
<script src="js/audio/a1_audio.js"></script>
<script src="js/audio/a2_audio.js"></script>
<script src="js/audio/b1_audio.js"></script>
<script src="js/audio/b2_audio.js"></script>

<!-- ═══════════════════════════════════════════════
     BRIQUE FINALE — APP (lit les variables globales ci-dessus)
═══════════════════════════════════════════════ -->
<script src="js/app.js"></script>

</body>
</html>
